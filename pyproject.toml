[project]
name = "fiumd"
dynamic = ["version"]
description = "Heterogeneous batching of coarse-grained MD with neural network potentials (fork of TorchMD)"
authors = [
    { name = "Hugo Hernández" },
    { name = "Paola B. Torres" },
    { name = "Lara Negri" },
    { name = "Rocío Cecchini" },
    { name = "Nicolás A. García" },
    { name = "Acellera (original TorchMD)" },
]

readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pyyaml",
    "tqdm",
    "moleculekit",
    "pandas",
    "networkx",
    "scipy", 
    "torch",
    "torchmd-net"
]

[project.urls]
homepage = "https://github.com/hernandezhdd/fiumd"
repository = "https://github.com/hernandezhdd/fiumd"
upstream = "https://github.com/torchmd/torchmd"

[tool.setuptools.packages.find]
include = ["fiumd*", "LICENSE.md"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "fiumd/_version.py"
versionfile_build = "fiumd/_version.py"
tag_prefix = "v"
parentdir_prefix = "fiumd-"

[build-system]
requires = ["setuptools", "toml", "versioneer[toml]==0.28"]
build-backend = "setuptools.build_meta"
